# Blueprint для Render: https://render.com/docs/blueprint-spec
# Після створення сервісу додай секрети в Dashboard (SHOPIFY_*, SUBSCRIPTION_*).
services:
  - type: web
    name: subscription-management-admin
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: subscription-management-db
          property: connectionString
      - key: SCOPES
        value: ""
      - key: SUBSCRIPTION_API_URL
        value: https://subscription.oplata.com.ua
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SUBSCRIPTION_ADMIN_TOKEN
        sync: false

databases:
  - name: subscription-management-db
    plan: free
