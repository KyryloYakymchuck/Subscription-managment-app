# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "14b772dc6c47c3b3eb0cf70f38a67779"
name = "Subscription Management"
application_url = "https://localhost"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# External subscription API only — Shopify scopes stay minimal.
scopes = ""

[access.admin]
embedded_app_direct_api_access = true
direct_api_mode = "online"

[auth]
redirect_urls = [ "https://localhost/auth/callback" ]

[webhooks]
api_version = "2026-10"

# Webhooks require a public HTTPS URL. Disabled for localhost / --use-localhost.
# Re-add before production deploy when application_url is a real host:
#   [[webhooks.subscriptions]]
#   uri = "/webhooks/app/uninstalled"
#   topics = ["app/uninstalled"]
#
#   [[webhooks.subscriptions]]
#   topics = [ "app/scopes_update" ]
#   uri = "/webhooks/app/scopes_update"
